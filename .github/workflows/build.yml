name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore XBMCVirtualController.sln

      - name: Build
        run: dotnet build XBMCVirtualController.sln -c Release --no-restore

      - name: Publish (single-file, self-contained win-x64)
        run: dotnet publish XBMCVirtualController/XBMCVirtualController.csproj -c Release --no-restore -o publish

      - name: Determine package name
        id: pkg
        shell: pwsh
        run: |
          $version = ([xml](Get-Content XBMCVirtualController/XBMCVirtualController.csproj)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          $name = "XBMCVirtualController-$version-win-x64"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$name"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Packaging $name"

      - name: Package zip (exe + skins)
        shell: pwsh
        run: |
          # The publish folder is exactly what ships: the single self-contained
          # exe plus the loose Skins folder and images it loads at runtime.
          Get-ChildItem publish | Format-Table Name, Length
          Compress-Archive -Path publish\* -DestinationPath "${{ steps.pkg.outputs.name }}.zip" -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error

      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pkg.outputs.name }}.zip
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # gh will not move an existing tag, so drop the previous rolling
          # release and its tag before recreating it at this commit. The first
          # ever run has nothing to delete, hence the swallowed exit code.
          gh release delete latest --cleanup-tag --yes 2>&1 | Write-Host
          $LASTEXITCODE = 0

          $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC')
          $notes = @(
            "Rolling build of the latest commit on main."
            ""
            "- Version: $env:VERSION"
            "- Commit: $env:GITHUB_SHA"
            "- Built: $built"
            ""
            "Unzip anywhere and run XBMCVirtualController.exe. Keep the Skins folder"
            "beside the exe. No .NET runtime install is required."
          ) -join "`n"
          Set-Content -Path latest-notes.md -Value $notes -Encoding utf8

          gh release create latest "$env:ZIP" `
            --title "Latest build ($($env:GITHUB_SHA.Substring(0,7)))" `
            --notes-file latest-notes.md `
            --latest

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pkg.outputs.name }}.zip
        run: |
          # --latest=false keeps the rolling "latest" release as the one the
          # repo's Latest badge points at.
          gh release create "$env:GITHUB_REF_NAME" "$env:ZIP" `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes `
            --latest=false
